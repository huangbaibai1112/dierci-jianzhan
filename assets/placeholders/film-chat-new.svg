<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B263E"/>
      <stop offset="100%" stop-color="#A02C48"/>
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="360" height="640" fill="#FAF7F2"/>
  
  <!-- Top Bar -->
  <rect width="360" height="74" fill="#FFFFFF"/>
  <circle cx="44" cy="42" r="22" fill="#F3ECE1"/>
  <circle cx="44" cy="38" r="9" fill="#7E706A"/>
  <ellipse cx="44" cy="54" rx="14" ry="9" fill="#7E706A"/>
  
  <text x="76" y="38" fill="#231C1A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">
    Eleanor, 58
  </text>
  <text x="76" y="55" fill="#246E56" font-family="'Inter', sans-serif" font-size="12" font-weight="700">
    ● 96% Compatibility Match
  </text>
  <rect x="250" y="28" width="94" height="28" rx="14" fill="#EBF5F1"/>
  <text x="297" y="46" fill="#1A5341" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    ID Confirmed
  </text>
  
  <line x1="0" y1="74" x2="360" y2="74" stroke="#ECE4D8" stroke-width="1"/>
  
  <!-- Conversation Date Divider -->
  <rect x="130" y="92" width="100" height="22" rx="11" fill="#F3ECE1"/>
  <text x="180" y="107" fill="#7E706A" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Today · 10:14 AM
  </text>
  
  <!-- Chat Bubble 1: Incoming from Eleanor -->
  <g transform="translate(16, 130)">
    <rect width="260" height="84" rx="16" fill="#FFFFFF" stroke="#ECE4D8" stroke-width="1"/>
    <text x="16" y="28" fill="#231C1A" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      Good morning! I noticed you enjoy
    </text>
    <text x="16" y="48" fill="#231C1A" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      weekend farmers markets and jazz.
    </text>
    <text x="16" y="68" fill="#7E706A" font-family="'Inter', sans-serif" font-size="11">
      Have you visited the South End stalls?
    </text>
  </g>
  
  <!-- Chat Bubble 2: Outgoing (Velvet Wine) -->
  <g transform="translate(84, 230)">
    <rect width="260" height="78" rx="16" fill="#8B263E"/>
    <text x="16" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      Yes! Every autumn Sunday. It's the
    </text>
    <text x="16" y="48" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      best coffee and quiet walk in town.
    </text>
    <text x="210" y="68" fill="#FDF0F3" font-family="'Inter', sans-serif" font-size="11">
      10:22 AM ✓✓
    </text>
  </g>
  
  <!-- Mutual Interests Card in Stream -->
  <g transform="translate(24, 335)">
    <rect width="312" height="180" rx="18" fill="#FFFFFF" stroke="#ECE4D8" stroke-width="1.5"/>
    <rect x="16" y="16" width="120" height="24" rx="12" fill="#FDF0F3"/>
    <text x="76" y="32" fill="#8B263E" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">
      SHARED PASSIONS
    </text>
    
    <text x="16" y="70" fill="#231C1A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">
      Natural Living &amp; Historic Cities
    </text>
    <text x="16" y="94" fill="#7E706A" font-family="'Inter', sans-serif" font-size="13">
      Both value honest dialogue, unhurried
    </text>
    <text x="16" y="114" fill="#7E706A" font-family="'Inter', sans-serif" font-size="13">
      weekends, and sincere companionship.
    </text>
    
    <rect x="16" y="132" width="280" height="34" rx="17" fill="#F3ECE1"/>
    <text x="156" y="153" fill="#231C1A" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      ✓ Manually Reviewed Profile
    </text>
  </g>
  
  <!-- Bottom Message Bar -->
  <rect x="0" y="570" width="360" height="70" fill="#FFFFFF"/>
  <rect x="16" y="582" width="270" height="42" rx="21" fill="#F3ECE1"/>
  <text x="36" y="608" fill="#7E706A" font-family="'Inter', sans-serif" font-size="13">
    Type a thoughtful message...
  </text>
  <circle cx="322" cy="603" r="20" fill="#D47414"/>
  <text x="322" y="609" fill="#FFFFFF" font-family="sans-serif" font-size="18" text-anchor="middle">➔</text>
</svg>
