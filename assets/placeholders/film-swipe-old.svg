<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A342E"/>
      <stop offset="60%" stop-color="#24201C"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="360" height="640" fill="#FFFFFF"/>
  
  <!-- Top App Bar -->
  <circle cx="36" cy="36" r="14" fill="#E8E2D8"/>
  <circle cx="180" cy="36" r="16" fill="#FF5864"/>
  <circle cx="324" cy="36" r="14" fill="#E8E2D8"/>
  
  <!-- Swipe Card -->
  <g transform="translate(16, 68)">
    <rect width="328" height="460" rx="16" fill="url(#photoGrad)"/>
    
    <!-- Profile Silhouette Placeholder -->
    <circle cx="164" cy="180" r="80" fill="#6A5F54" opacity="0.8"/>
    <ellipse cx="164" cy="320" rx="110" ry="80" fill="#6A5F54" opacity="0.8"/>
    
    <!-- Profile Info Overlay -->
    <rect x="0" y="340" width="328" height="120" rx="16" fill="url(#photoGrad)" opacity="0.9"/>
    <text x="20" y="395" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">
      Imani, 28
    </text>
    <text x="20" y="425" fill="#C5BFB5" font-family="'Inter', sans-serif" font-size="14" font-weight="600">
      📍 2 miles away · Active now
    </text>
  </g>
  
  <!-- Swipe Action Buttons (Tinder Style) -->
  <g transform="translate(24, 548)">
    <!-- Rewind -->
    <circle cx="28" cy="36" r="24" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
    <text x="28" y="43" fill="#F5B33B" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">↺</text>
    <circle cx="44" cy="20" r="7" fill="#24211E"/>
    <text x="44" y="24" fill="#FFFFFF" font-size="9" text-anchor="middle">🔒</text>
    
    <!-- Nope / Dislike -->
    <circle cx="92" cy="36" r="28" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
    <text x="92" y="45" fill="#FE3C72" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">✕</text>
    
    <!-- Super like -->
    <circle cx="156" cy="36" r="24" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
    <text x="156" y="44" fill="#2AB6FC" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">★</text>
    
    <!-- Like / Heart -->
    <circle cx="220" cy="36" r="28" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
    <text x="220" y="45" fill="#12D18E" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle">♥</text>
    
    <!-- Boost -->
    <circle cx="284" cy="36" r="24" fill="#FFFFFF" stroke="#E5DED3" stroke-width="2"/>
    <text x="284" y="44" fill="#A455F7" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>
  </g>
</svg>
