<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1B25"/>
      <stop offset="100%" stop-color="#261219"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8B263E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#261219" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="680" fill="url(#bgGrad)"/>
  <circle cx="400" cy="260" r="220" fill="url(#glow)"/>
  
  <!-- Silhouette of mature woman outdoors enjoying coffee/conversation -->
  <g fill="#EFE8DE" opacity="0.9" transform="translate(400, 310)">
    <!-- Head & hair -->
    <ellipse cx="0" cy="-110" rx="64" ry="76"/>
    <!-- Hair bun / mature hairstyle -->
    <path d="M-64 -115 C-65 -180 65 -180 64 -115 C45 -145 -45 -145 -64 -115 Z"/>
    <!-- Neck -->
    <path d="M-22 -40 L22 -40 L28 10 L-28 10 Z"/>
    <!-- Shoulders & Cardigan -->
    <path d="M-28 10 Q-120 40 -190 180 L190 180 Q120 40 28 10 Z"/>
  </g>
  
  <!-- Warm overlay text -->
  <rect x="250" y="560" width="300" height="50" rx="25" fill="#FFFFFF" opacity="0.95"/>
  <text x="400" y="592" fill="#231C1A" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    Eleanor, 58 · Denver, CO
  </text>
  <text x="400" y="640" fill="#DBCFCB" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">
    [ Replace with your custom photo · 800×680px ]
  </text>
</svg>
